name: PWA validation
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  push:
    paths: ['web/**', '.github/workflows/web.yml']
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run deploy:check
      - name: Confirm the native source is preserved
        run: git diff --exit-code b9d452cb640aa639506386860ade39f7bef7a853 -- ../DefencePensionCalculator ../Package.swift ../scripts ../README.md ../VALIDATION.md ../.gitignore ../validation ../.github/workflows/ios.yml
