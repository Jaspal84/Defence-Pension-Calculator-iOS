name = "defence-pension-pwa"
main = "worker/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
PAYMENTS_MODE = "disabled"
# Set to your actual HTTPS origin after first deployment, before enabling test checkout.
APP_ORIGIN = "https://replace-with-your-worker.workers.dev"
MERCHANT_NAME = "Defence Pension Calculator"
SUPPORT_EMAIL = ""

[[d1_databases]]
binding = "DB"
database_name = "pension-payments"
# Replace with the UUID returned by `wrangler d1 create pension-payments`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[env.local.vars]
PAYMENTS_MODE = "disabled"
APP_ORIGIN = "http://localhost:5173"
MERCHANT_NAME = "Defence Pension Calculator"
SUPPORT_EMAIL = ""

[[env.local.d1_databases]]
binding = "DB"
database_name = "pension-payments"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
